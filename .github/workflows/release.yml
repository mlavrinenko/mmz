name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  BINARY_NAME: "" # set dynamically in the 'name' step

# Actions are pinned: first-party actions to immutable release tags, third-party
# actions to commit SHAs. Bump them with Dependabot's `github-actions` ecosystem.
jobs:
  name:
    name: Detect binary name
    runs-on: ubuntu-latest
    outputs:
      binary: ${{ steps.meta.outputs.binary }}
    steps:
      - uses: actions/checkout@v6.0.3
      - id: meta
        run: |
          name=$(sed -n 's/^name = "\(.*\)"/\1/p' Cargo.toml | head -1)
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "binary=$name" >> "$GITHUB_OUTPUT"
          # Guard: the pushed tag must match the Cargo.toml version, otherwise
          # `cargo publish` would ship a different version than the tag implies.
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $version"
            exit 1
          fi

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Check
        run: nix develop --command just check

  build:
    name: Build (${{ matrix.target }})
    needs: [check, name]
    runs-on: ${{ matrix.os }}
    # Two flavours per target, because which grammars a build carries is a
    # compile-time choice and the two audiences want opposite answers.
    #
    # `default` is byte-for-byte what `cargo install mmz` gives you: Rust alone,
    # ~5.5 MB. `full` is `lang-all` — every grammar, ~45 MB, and the only build
    # for which a manifest naming a language can never be answered with "rebuild
    # it yourself". The people downloading a prebuilt binary are the people who
    # did not want to build one, so shipping only the first left exactly them
    # stuck.
    #
    # No third "popular" tier. `default` fails predictably and `full` never
    # fails; a curated middle fails for SOME of your colleagues and not others,
    # which is the trap the docs already warn about wearing a release asset's
    # name. Anyone wanting a specific subset has `cargo install --features`,
    # which beats any set we could pick for them.
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
        flavour: [default, full]
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          # The asset keeps the plain name, so the file a reader reaches for
          # first is the one that matches `cargo install mmz`.
          - flavour: default
            features: ""
            suffix: ""
          - flavour: full
            features: "--features lang-all"
            suffix: "-full"

    steps:
      - uses: actions/checkout@v6.0.3

      # Cross-platform release binaries are built with rustup rather than Nix
      # (Nix on the Windows/macOS runners is impractical). Pinned to a commit, so
      # the channel must be given explicitly; it tracks rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable channel pinned below
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # Keyed by flavour as well as target: the two builds share a target
      # directory name and nothing else, and a `full` build restoring a
      # `default` cache would recompile everything anyway.
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          key: ${{ matrix.target }}-${{ matrix.flavour }}

      # Every tree-sitter scanner in the dependency set is C, none C++, so the
      # C cross-compiler below covers all twenty-seven grammars and not just
      # the one a default build carries. The `cc` crate finds it by the target
      # triple's conventional prefix; only the linker has to be named.
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.features }}

      # The binary's own account of what it carries, checked against the
      # flavour this leg was supposed to build. Without it a matrix wiring
      # mistake ships two identical binaries under two names, and nothing
      # downstream would notice — the file sizes are the only other tell, and
      # nobody reads those. Skipped on the cross leg, which cannot run its own
      # output.
      - name: Verify the flavour is what it claims
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          set -eo pipefail
          expected='1 ast lang'
          if [ "${{ matrix.flavour }}" = full ]; then expected='28 ast langs'; fi
          ext=""
          if [ "${{ runner.os }}" = Windows ]; then ext=".exe"; fi
          reported=$(./target/${{ matrix.target }}/release/${{ needs.name.outputs.binary }}$ext --version)
          echo "$reported"
          case "$reported" in
            *"($expected)"*) ;;
            *) echo "::error::${{ matrix.flavour }} build reports '$reported', expected '($expected)'"; exit 1 ;;
          esac

      # Assets are archives, not raw binaries. A tree-sitter parse table is a
      # large array of small integers, and it shows: the `full` flavour goes
      # 45.4 MB -> 5.7 MB, eight to one, across five targets. The raw asset was
      # defensible while every one was ~2 MB and is not at 45 MB.
      #
      # This RENAMES the assets, which is the only reason it was not done with
      # the flavour split. Nothing is pinned to the old names: every asset of
      # every release from v0.1.1 to v0.7.0 sits at 0-1 downloads, this repo
      # publishes no install script, and the docs link the releases page rather
      # than any asset. Old releases keep their raw binaries; the change starts
      # here and gets cheaper never.
      #
      # One bash step for every runner rather than a unix/windows pair: the
      # `.zip`-vs-`.tar.gz` split is two lines, and the naming, staging and
      # LICENSE copy are identical. Windows runners ship both bash and 7z.
      #
      # The archive is flat — the binary under its plain name, so an extract
      # puts a runnable `mmz` in the current directory rather than a versioned
      # folder to reach into. LICENSE-MIT rides along because redistributing a
      # binary is exactly the case the licence asks to be carried with it; the
      # raw assets never did.
      - name: Package the archive
        shell: bash
        run: |
          set -eo pipefail
          bin='${{ needs.name.outputs.binary }}'
          asset="$bin${{ matrix.suffix }}-${{ matrix.target }}"
          src="target/${{ matrix.target }}/release/$bin"
          mkdir -p dist
          cp LICENSE-MIT dist/
          if [ "${{ runner.os }}" = Windows ]; then
            cp "$src.exe" "dist/$bin.exe"
            (cd dist && 7z a -tzip -mx=9 "../$asset.zip" "$bin.exe" LICENSE-MIT >/dev/null)
            packaged="$asset.zip"
          else
            cp "$src" "dist/$bin"
            tar -czf "$asset.tar.gz" -C dist "$bin" LICENSE-MIT
            packaged="$asset.tar.gz"
          fi
          ls -l "$packaged"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ needs.name.outputs.binary }}${{ matrix.suffix }}-${{ matrix.target }}
          path: ${{ needs.name.outputs.binary }}${{ matrix.suffix }}-${{ matrix.target }}.*

  publish:
    name: Publish to crates.io
    # Depends on build so a failed target stops the (irreversible) crates.io push.
    needs: [check, name, build]
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable channel pinned below
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2.9.1

      # `--locked` keeps the published build reproducible; requires a committed Cargo.lock.
      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release:
    name: Create GitHub Release
    needs: [name, build, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          merge-multiple: true

      # Checksums exist because the assets are now archives. A raw binary
      # answers "did this download intact" by running it; an archive that
      # arrived truncated fails inside a tar, one step removed from the
      # download that actually broke. One file over the whole set, in the
      # format `sha256sum -c` reads back.
      - name: Checksum the assets
        run: sha256sum ${{ needs.name.outputs.binary }}-* > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          generate_release_notes: true
          files: |
            ${{ needs.name.outputs.binary }}-*
            SHA256SUMS
