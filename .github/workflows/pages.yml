name: Deploy Pages

# The site is BUILT here, not uploaded verbatim. www/ holds Typst sources and
# three generators; the published HTML is what `just docs::build` produces from
# them, with every transcript captured from the binary this commit builds.
#
# `paths:` is deliberately broad. A doc page reads the crate version, the config
# schema, the help text, the gate table and the fixture, so a change to any of
# those changes the published site even when nothing under www/ moved.
on:
  push:
    branches: [main]
    paths:
      - www/**
      - docs/**
      - examples/demo/**
      - src/**
      - schema/**
      - Justfile
      - .just/**
      - Cargo.toml
      - Cargo.lock
      - .linecop.yaml
      - flake.nix
      - flake.lock
      - .github/workflows/pages.yml
  workflow_dispatch: ~

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      # Same dev shell as local development, so a site that builds locally
      # builds here. `docs::build` runs the generators, compiles every page with
      # tola, and indexes the result with Pagefind.
      - name: Build the docs site
        run: nix develop --command just docs::build

      # tola writes a CNAME from the host part of tola.toml's `url` — here,
      # `mlavrinenko.github.io`. GitHub Pages reads a CNAME in the published
      # artifact as a CUSTOM DOMAIN declaration, and this is a project page with
      # no custom domain: publishing it would either be rejected or would claim
      # the account's user-page domain for this project. Drop it.
      - name: Strip the auto-generated CNAME
        run: rm -f www/public/mmz/CNAME

      - uses: actions/configure-pages@v6.0.0
      # tola builds under the site's own path prefix (www/public/mmz), which is
      # the directory Pages must serve as the site root.
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: www/public/mmz
      - id: deployment
        uses: actions/deploy-pages@v5.0.0
