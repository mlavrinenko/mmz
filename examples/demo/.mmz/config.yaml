# yaml-language-server: $schema=../../../schema/mmz.schema.json

scopes:
  data: ["data/*.json"]
  bin: ["bin/*.sh"]

probes:
  # jq's version is an input, but not a file.
  jq-version:
    run: jq --version

on_hit: "mmz: skipped {cache:command} (inputs unchanged)"

commands:
  - name: ./bin/validate.sh
    inputs: [data, bin, jq-version]
    tags: [gate]

  - name: ./bin/report.sh
    inputs: [data, bin, jq-version]
    outputs:
      - out/report.txt
    tags: [gate, report]
