# yaml-language-server: $schema=schema/mmz.schema.json
# mmz memoizes its own checks (dogfood). `just check` wraps the slow, read-only
# checks with the locally built mmz binary; a no-op `just check` then skips them.

scopes:
  # Everything cargo test / clippy / machete read: sources, the manifest and
  # lockfile, and the toolchain pins (rust-toolchain plus the nix flake.lock
  # that actually selects rustc in the dev shell).
  rust: ["**/*.rs", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "flake.lock"]
  clippy: ["clippy.toml"]
  fmt: ["rustfmt.toml"]

commands:
  - name: cargo test
    inputs: [rust]
  - name: cargo clippy
    inputs: [rust, clippy]
  - name: cargo machete
    inputs: [rust]
  - name: cargo fmt
    inputs: [rust, fmt]
