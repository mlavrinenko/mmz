# yaml-language-server: $schema=../../schema/mmz-fragment.schema.json
#
# Repo-wide scripts and drift gates: check-file-size, outdatty-check. Imported
# by ../config.yaml's `conf.d/` entry.

scopes:
  # The gate scripts, and the config files the size and drift gates read.
  gate-scripts: [".just/scripts/*.sh"]
  linecop-config: [".linecop.yaml"]
  outdatty-config: ["outdatty.yaml", "outdatty.lock"]

probes:
  # See ../conf.d/10-rust.yaml for why every recipe probe below carries `-S` and `-e`.
  recipe-check-file-size:
    run: just --dump --dump-format json | jq -S -e -c '.recipes["check-file-size"]'
  recipe-outdatty-check:
    run: just --dump --dump-format json | jq -S -e -c '.recipes["outdatty-check"]'

commands:
  # linecop walks the whole tree, so this one is honestly broad. Its scopes are
  # the file sets whose SIZE the gate is judging, plus its own config. `rust`
  # is declared in ../conf.d/10-rust.yaml; docs-src/docs-md-src/docs-md-out in
  # ../conf.d/20-docs.yaml.
  - name: just check-file-size
    inputs:
      [rust, docs-src, docs-md-src, docs-md-out, linecop-config, recipe-check-file-size]
    tags: [gate]

  - name: just outdatty-check
    inputs:
      [rust, docs-src, docs-md-src, docs-md-out, outdatty-config, recipe-outdatty-check]
    tags: [gate]
