# yaml-language-server: $schema=../../schema/mmz-fragment.schema.json
#
# Repo-wide scripts and drift gates: check-file-size, outdatty-check. Imported
# by ../config.yaml's `conf.d/` entry.

scopes:
  # The gate scripts, and the config files the size and drift gates read.
  gate-scripts: [".just/scripts/*.sh"]
  linecop-config: [".linecop.yaml"]
  outdatty-config: ["outdatty.yaml", "outdatty.lock"]

probes:
  # See ../conf.d/10-rust.yaml for why every recipe probe below carries `-S` and `-e`.
  recipe-check-file-size:
    run: just --dump --dump-format json | jq -S -e -c '.recipes["check-file-size"]'
  recipe-outdatty-check:
    run: just --dump --dump-format json | jq -S -e -c '.recipes["outdatty-check"]'

  # Both gates in this file run a qahq binary and nothing else — linecop and
  # outdatty are `qahq.packages.<system>` in flake.nix, so one node pins both.
  # Read ../conf.d/10-rust.yaml's `nixpkgs-tools` block before copying this
  # shape: it is the same three lines, and it is not the same guarantee. qahq is
  # a direct flake input, so this node moves when and only when the binaries do
  # — exact. `nixpkgs-tools` selects the one `nixpkgs` node that dozens of
  # unrelated packages arrive through, so it over-busts by construction. From
  # `inputs:` the two are indistinguishable.
  #
  # The payoff of splitting them is visible right here: neither rule below names
  # `nixpkgs-tools`, so `nix flake update nixpkgs` no longer re-runs the size and
  # drift gates. Under the whole-file flake.lock these two busted on every input
  # in the repo.
  qahq-tools:
    file: flake.lock
    json: '.nodes["qahq"]["locked"]["narHash"]'

commands:
  # linecop walks the whole tree, so this one is honestly broad. Its scopes are
  # the file sets whose SIZE the gate is judging, plus its own config, plus the
  # input that ships linecop itself. `rust` is declared in
  # ../conf.d/10-rust.yaml; docs-src/docs-md-src/docs-md-out in
  # ../conf.d/20-docs.yaml.
  - name: just check-file-size
    inputs:
      [
        rust,
        docs-src,
        docs-md-src,
        docs-md-out,
        linecop-config,
        recipe-check-file-size,
        qahq-tools,
      ]
    tags: [gate]

  - name: just outdatty-check
    inputs:
      [
        rust,
        docs-src,
        docs-md-src,
        docs-md-out,
        outdatty-config,
        recipe-outdatty-check,
        qahq-tools,
      ]
    tags: [gate]
