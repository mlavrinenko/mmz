# yaml-language-server: $schema=../../schema/mmz-fragment.schema.json
#
# Repo-wide scripts and drift gates: check-file-size, outdatty-check,
# check-changelog-history. Imported by ../config.yaml's `conf.d/` entry.

scopes:
  # The gate scripts, and the config files the size and drift gates read.
  gate-scripts: [".just/scripts/*.sh"]
  linecop-config: [".linecop.yaml"]
  outdatty-config: ["outdatty.yaml", "outdatty.lock"]
  # The changelog and the waivers recorded against it. Both sides of the
  # history gate's working-tree half; its other half is in git, which no glob
  # can reach — see `changelog-tags` below.
  changelog: ["CHANGELOG.md", "CHANGELOG.waivers"]

probes:
  # See ../conf.d/10-rust.yaml for why every recipe probe below carries `-S` and `-e`.
  recipe-check-file-size:
    run: just --dump --dump-format json | jq -S -e -c '.recipes["check-file-size"]'
  recipe-outdatty-check:
    run: just --dump --dump-format json | jq -S -e -c '.recipes["outdatty-check"]'
  recipe-check-changelog-history:
    run: just --dump --dump-format json | jq -S -e -c '.recipes["check-changelog-history"]'

  # The history gate compares the working CHANGELOG.md against what each `v*`
  # tag shipped, and that second side lives in git — no scope's globs reach it,
  # so without this probe a new tag, a moved tag or a re-tag would leave the
  # gate reading fresh against a comparison it never made.
  #
  # A tag's commit fully determines the bytes at that commit, so hashing the
  # tag list plus what each entry resolves to is the whole input: `%(objectname)`
  # is the tag object (or the commit, for a lightweight tag) and
  # `%(*objectname)` the commit an annotated tag dereferences to. `--merged HEAD`
  # matches the gate's own reachability filter, and `--sort` makes the output
  # order git's rather than the ref-store's.
  #
  # The one `run:` probe in this file, so it costs a process on every
  # `mmz --is-fresh` — accepted here because there is no file-shaped substitute:
  # .git/refs is packed away by `git gc` and reading it would be reaching past
  # the tool that owns it.
  changelog-tags:
    run: git tag --list 'v*' --merged HEAD --sort=refname --format='%(refname:short) %(objectname) %(*objectname)'

  # The size and drift gates in this file run a qahq binary and nothing else —
  # linecop and outdatty are `qahq.packages.<system>` in flake.nix, so one node
  # pins both. (The third gate here, check-changelog-history, runs git and
  # names `nixpkgs-tools` instead; see its rule below.)
  # Read ../conf.d/10-rust.yaml's `nixpkgs-tools` block before copying this
  # shape: it is the same three lines, and it is not the same guarantee. qahq is
  # a direct flake input, so this node moves when and only when the binaries do
  # — exact. `nixpkgs-tools` selects the one `nixpkgs` node that dozens of
  # unrelated packages arrive through, so it over-busts by construction. From
  # `inputs:` the two are indistinguishable.
  #
  # The payoff of splitting them is visible right here: neither the size nor the
  # drift rule names `nixpkgs-tools`, so `nix flake update nixpkgs` no longer
  # re-runs them. Under the whole-file flake.lock these two busted on every
  # input in the repo.
  #
  # Both recipes are nonetheless *launched* by `just`, which comes out of
  # nixpkgs — so why is `nixpkgs-tools` absent? Because the rule this manifest
  # applies is: declare the tool that produces the VERDICT, not the launcher
  # that invokes it. linecop decides whether a file is too long; outdatty
  # decides whether a dependent drifted; `just` only shells out to them. That
  # reading is applied uniformly — no gate anywhere declares `just` as a tool,
  # and the Rust gates name `nixpkgs-tools` for cargo, clippy and rustfmt
  # rather than for the launcher they share with these two.
  #
  # The alternative — every gate names `nixpkgs-tools` because every recipe is
  # run by `just` — is defensible and was considered. It was rejected because
  # it makes the proxy universal, and a probe every rule names is the
  # whole-file `flake.lock` again under a longer name. If a `just` upgrade ever
  # does change a gate's outcome without changing its dumped recipe body, this
  # is the decision to revisit; it is one probe name away.
  qahq-tools:
    file: flake.lock
    json: '.nodes["qahq"]["locked"]["narHash"]'

commands:
  # linecop walks the whole tree, so this one is honestly broad. Its scopes are
  # the file sets whose SIZE the gate is judging, plus its own config, plus the
  # input that ships linecop itself. `rust` is declared in
  # ../conf.d/10-rust.yaml; docs-src/docs-md-src/docs-md-out in
  # ../conf.d/20-docs.yaml.
  - name: just check-file-size
    inputs:
      [
        rust,
        docs-src,
        docs-md-src,
        docs-md-out,
        linecop-config,
        recipe-check-file-size,
        qahq-tools,
      ]
    tags: [gate]

  - name: just outdatty-check
    inputs:
      [
        rust,
        docs-src,
        docs-md-src,
        docs-md-out,
        outdatty-config,
        recipe-outdatty-check,
        qahq-tools,
      ]
    tags: [gate]

  # Narrow on purpose, unlike the two above: this gate opens CHANGELOG.md, its
  # waivers, and git. It reads no source and no doc, so a Rust edit that busts
  # every other rule in this file must leave it fresh — the whole reason a
  # history check is cheap enough to sit in `just check` at all.
  #
  # `nixpkgs-tools` rather than `qahq-tools`: git is the tool that produces this
  # verdict (`git show <tag>:CHANGELOG.md` is the comparison), and git comes out
  # of nixpkgs through the dev shell, so the proxy is the honest pin. It
  # over-busts, which for a gate that runs in well under a second is a cost
  # worth nothing. `gate-scripts` covers the script holding the logic.
  - name: just check-changelog-history
    inputs:
      [
        changelog,
        changelog-tags,
        gate-scripts,
        recipe-check-changelog-history,
        nixpkgs-tools,
      ]
    tags: [gate]
