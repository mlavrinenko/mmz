# yaml-language-server: $schema=../../schema/mmz-fragment.schema.json
#
# The docs gates: docs::check, docs::md-check, check-doc-coverage,
# check-doc-facts. Imported by ../config.yaml's `conf.d/` entry.
#
# docs-src and fixture are declared here rather than in 10-rust.yaml or
# 30-repo.yaml, even though just fmt-check (10-rust.yaml) and just
# check-file-size / just outdatty-check (30-repo.yaml) read docs-src too, and
# just test (10-rust.yaml) reads fixture too. This is the fragment whose own
# rules exist BECAUSE of the docs pipeline and the fixture, so the scopes live
# beside the rules that are most about them; the other fragments reference
# them by name instead of redeclaring them.

scopes:
  # The docs pipeline: the site's sources and generators, the Markdown sources,
  # and the fixture every transcript is captured from.
  docs-src: ["www/**/*.typ", "www/**/*.sh", "www/**/*.jq", "www/tola.toml"]
  docs-assets: ["www/assets/**"]
  docs-md-src: ["docs/src/**/*.typ", "docs/generate-md.sh"]
  # The committed outputs of the Markdown render. They are inputs to the
  # freshness check, which compares them against a fresh render.
  docs-md-out: ["README.md", "AGENTS.md", "CONTRIBUTING.md", "docs/contributing/*.md"]
  fixture: ["examples/demo/**"]

probes:
  # See ../conf.d/10-rust.yaml for why every recipe probe below carries `-S` and `-e`.
  recipe-check-doc-coverage:
    run: just --dump --dump-format json | jq -S -e -c '.recipes["check-doc-coverage"]'
  recipe-check-doc-facts:
    run: just --dump --dump-format json | jq -S -e -c '.recipes["check-doc-facts"]'
  # The docs module's recipes, reached through `.modules` — a module recipe is
  # not in the top-level `.recipes` map.
  recipe-docs-check:
    run: just --dump --dump-format json | jq -S -e -c '.modules.docs.recipes["check"], .modules.docs.recipes["gen"]'
  recipe-docs-md-check:
    run: just --dump --dump-format json | jq -S -e -c '.modules.docs.recipes["md-check"], .modules.docs.recipes["gen"]'

  # The site generator, pinned by its own flake input rather than by a version
  # string: tola is `tola.url` in flake.nix, so this node moves when and only
  # when the `tola build` / `tola validate` binary does. Read ../conf.d/10-rust.yaml's
  # `nixpkgs-tools` block before adding another of these — an identical-looking
  # probe over the `nixpkgs` node is an exact pin here and only a proxy there,
  # and `inputs:` does not show the difference.
  #
  # The boundary is drawn at tola, not past it. tola embeds Typst, so a
  # docs build technically depends on that compiler too; declaring the input
  # that ships the binary and stopping is the honest line, because whatever
  # tola bundles moves with tola's node anyway.
  tola-tools:
    file: flake.lock
    json: '.nodes["tola"]["locked"]["narHash"]'

commands:
  # The doc gates read the binary's own help text and schema, so the Rust
  # sources are inputs to both. `rust` and `nixpkgs-tools` are declared in
  # ../conf.d/10-rust.yaml; gate-scripts in ../conf.d/30-repo.yaml.
  #
  # Every rule below names `nixpkgs-tools`: all four build mmz with cargo and
  # query Typst sources with `typst query`, and jq, yq and flock are in the
  # scripts too — every one of those out of nixpkgs.
  - name: just check-doc-coverage
    inputs: [rust, docs-src, gate-scripts, recipe-check-doc-coverage, nixpkgs-tools]
    tags: [gate]

  - name: just check-doc-facts
    inputs:
      [
        rust,
        docs-src,
        gate-scripts,
        fixture,
        recipe-check-doc-facts,
        nixpkgs-tools,
      ]
    tags: [gate]

  # The docs build compiles every page and runs the real binary against the
  # fixture, so it depends on the binary, the fixture, and the site sources. It
  # is the one gate drawing tools from two flake inputs: tola builds and
  # validates the site, while cargo, jq, yq, flock and pagefind come from
  # nixpkgs — so a tola release busts this rule and nothing else, and a nixpkgs
  # bump busts it alongside the Rust gates.
  - name: just docs::check
    inputs:
      [
        rust,
        docs-src,
        docs-assets,
        fixture,
        recipe-docs-check,
        nixpkgs-tools,
        tola-tools,
      ]
    tags: [gate]

  # typlite, the renderer this gate diffs against, ships inside tinymist — a
  # nixpkgs package, not a flake input of its own — so this one is `nixpkgs-tools`
  # despite being a Typst gate.
  - name: just docs::md-check
    inputs:
      [
        rust,
        docs-src,
        docs-md-src,
        docs-md-out,
        fixture,
        gate-scripts,
        recipe-docs-md-check,
        nixpkgs-tools,
      ]
    tags: [gate]
