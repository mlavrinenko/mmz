# yaml-language-server: $schema=../../schema/mmz-fragment.schema.json
#
# The Rust gates: fmt-check, clippy, test, machete. Imported by
# ../config.yaml's `conf.d/` entry.
#
# `rust` is declared here rather than in 20-docs.yaml or 30-repo.yaml, even
# though check-doc-coverage, check-doc-facts, docs::check, docs::md-check,
# check-file-size and outdatty-check (all in the other two fragments) read it
# too. Every rule in THIS file needs it, it is the scope those gates cross a
# fragment boundary to reach rather than the other way round, and a scope may
# only be declared in one file — the others reference it by name.

scopes:
  # Everything the Rust gates read: sources, the manifest and lockfile, and the
  # toolchain pin. rust-toolchain.toml is a file cargo genuinely reads, so it
  # belongs in a scope; flake.lock used to sit here beside it and no longer
  # does. It was never a file these gates read — it stood in for the BINARIES
  # the dev shell selects, and a whole-file hash of it conflates a hundred
  # nodes, so bumping nixpkgs-lib busted clippy exactly as bumping qahq did.
  # The `*-tools` probes below name the one node each gate's tools come out of
  # instead.
  rust:
    [
      "src/**/*.rs",
      "tests/**/*.rs",
      "Cargo.toml",
      "Cargo.lock",
      "rust-toolchain.toml",
    ]
  clippy-config: ["clippy.toml"]
  rustfmt-config: ["rustfmt.toml"]
  # cargo-machete reads the Cargo manifests, not the sources, so a source-only
  # edit must not bust it.
  manifests: ["Cargo.toml", "Cargo.lock"]

probes:
  # One probe per gate recipe: `just --dump` renders the recipe's body,
  # attributes and parameters as JSON, and hashing THAT scopes the dependency to
  # the one recipe instead of to the whole Justfile.
  #
  # `-e` is load-bearing on every one of these. Without it, a renamed recipe
  # would make the selector yield `null`, jq would exit 0, and the rule would go
  # permanently fresh against a digest that tracks nothing — the exact silent
  # failure this tool exists to prevent. With it, a rename is a loud probe
  # failure naming the probe (exit 6).
  #
  # `-S` is load-bearing for a different reason: it sorts object keys, so the
  # digest tracks the recipe's CONTENT rather than the key order whichever
  # `just` happens to be on PATH emits. Without it, just 1.43 and just 1.51
  # render the same recipe into the same JSON with the keys in a different
  # order, and every gate reads stale against a worktree whose checks passed —
  # observed when a bare `mt done` ran outside the dev shell. An unsorted hash
  # of a JSON object is a latent version dependency; sorting removes the
  # accidental half of it. The deliberate half — a `just` whose rendering
  # differs in substance, not order — is not addressed here.
  #
  # Both notes apply to every recipe probe in every fragment under conf.d/,
  # not just the ones below — they live here, in the first fragment
  # ../config.yaml imports, instead of being repeated three times.
  recipe-fmt-check:
    run: just --dump --dump-format json | jq -S -e -c '.recipes["fmt-check"]'
  recipe-clippy:
    run: just --dump --dump-format json | jq -S -e -c '.recipes["clippy"]'
  recipe-test:
    run: just --dump --dump-format json | jq -S -e -c '.recipes["test"]'
  recipe-machete:
    run: just --dump --dump-format json | jq -S -e -c '.recipes["machete"]'
  # The formatter's own path lists live in Justfile variables rather than in a
  # recipe body, so fmt-check depends on them separately.
  fmt-paths:
    run: just --dump --dump-format json | jq -S -e -c '.assignments | with_entries(select(.key | test("_FMT_PATHS$")))'

  # --- the tools, as opposed to the files -------------------------------------
  #
  # A gate rule declares what its recipe READS and what its recipe IS. Neither
  # says which binaries ran it, so a `nix flake update` used to leave a recorded
  # pass looking current after the compiler that earned it stopped existing.
  # `nixpkgs-tools`, `qahq-tools` (../conf.d/30-repo.yaml) and `tola-tools`
  # (../conf.d/20-docs.yaml) are that missing declaration, one probe per flake
  # input the dev shell draws binaries from.
  #
  # All three are `file:` + `json:` probes, so they cost NO process at all —
  # mmz reads flake.lock and selects out of it in-process. That matters because
  # a bare `mmz --is-fresh` gates every rule at once; a `--version` spelling
  # would add one spawn per tool per invocation to buy a coarser answer, since
  # a rebuild at an unchanged version still moves a narHash and does not move a
  # version string.
  #
  # THE TWO SPELLINGS ARE NOT THE SAME MECHANISM, and they look identical from
  # `inputs:` — a rule names `qahq-tools` exactly the way it names
  # `nixpkgs-tools`, and nothing at the call site says one is exact and the
  # other is a proxy. Which one a tool gets is decided by where the tool comes
  # from in flake.nix, not by preference:
  #
  #   - A tool that is its OWN flake input has a node of its own, and that
  #     node's narHash moves when and only when the binaries move. qahq
  #     supplies cargo-crap, ejectest, linecop and outdatty; tola supplies
  #     tola. For these the probe is exact.
  #   - A tool that comes out of nixpkgs has no node of its own. rustc, cargo,
  #     clippy, rustfmt, cargo-machete, jq, yq, just, typst, typstyle, tinymist
  #     (for typlite), pagefind and util-linux all arrive through the single
  #     `nixpkgs` node, so `nixpkgs-tools` moves on every nixpkgs bump whether
  #     or not the tool in question changed. That is a proxy, and it
  #     over-busts. It is still strictly finer than the whole-file flake.lock
  #     it replaces, because it does not move when qahq or tola do — which is
  #     the churn the old spelling actually charged for.
  #
  # There is no fenix or rust-overlay here: fenix appears in flake.lock only as
  # a transitive input of qahq and tola, so selecting it would track a
  # toolchain this repo's gates never run.
  #
  # A selector that resolves to `null` or to nothing is a hard probe failure
  # (exit 6), not a silently-empty digest — so a renamed or removed input fails
  # loudly here the same way `jq -e` makes a renamed recipe fail above.
  nixpkgs-tools:
    file: flake.lock
    json: '.nodes["nixpkgs"]["locked"]["narHash"]'

commands:
  # `just fmt-check` formats Rust, Typst and the Justfiles, so every file any of
  # those three touch is an input — which is why the docs sources are in here
  # alongside the Rust. docs-src and docs-md-src are declared in
  # ../conf.d/20-docs.yaml; referenced here by name. Its three formatters
  # (rustfmt, typstyle, `just --fmt`) all come out of nixpkgs, so one tool probe
  # covers the set.
  - name: just fmt-check
    inputs:
      [
        rust,
        rustfmt-config,
        docs-src,
        docs-md-src,
        fmt-paths,
        recipe-fmt-check,
        nixpkgs-tools,
      ]
    tags: [gate]

  - name: just clippy
    inputs: [rust, clippy-config, recipe-clippy, nixpkgs-tools]
    tags: [gate]

  # fixture is declared in ../conf.d/20-docs.yaml — the fixture is a docs-pipeline
  # concern first, and `just test` happens to exercise it too.
  - name: just test
    inputs: [rust, fixture, recipe-test, nixpkgs-tools]
    tags: [gate]

  # cargo-machete comes from the dev shell (flake.nix), not from anything
  # `manifests` names, so a bump that changes which cargo-machete runs must bust
  # this or the recorded pass outlives the binary that produced it. That is what
  # `nixpkgs-tools` is doing here — and it is the whole rule's toolchain
  # dependency: machete reads the manifests and never opens a source file, so it
  # names neither `rust` nor rust-toolchain.toml.
  - name: just machete
    inputs: [manifests, recipe-machete, nixpkgs-tools]
    tags: [gate]
