# yaml-language-server: $schema=../schema/mmz.schema.json
#
# mmz memoizes its own checks (dogfood). Every `just check` arm runs through
# `just memo <gate>`, which is `mmz just <gate>` — so the rules below are named
# after RECIPES, not after command lines. That indirection is the point: naming
# the command line meant this file held a hand-maintained mirror of every recipe
# body, and a recipe growing a flag desynchronised the mirror silently.
#
# What the recipe DOES is then an input rather than an identity, which is what
# the per-recipe probes below are for. Hashing the whole Justfile instead (as
# this file used to) meant editing one docs recipe busted clippy and the full
# test suite.
#
# Every rule is tagged `gate`. Closing a MindTape task runs
# `mmz --is-fresh --tag gate` (see .mindtape/config.toml's `[[on.flip]]`), which
# asserts each gate rule last passed against this worktree instead of re-running
# it — the predicate a review wants is proof of a passing build, not a re-run at
# the least convenient moment. Record a pass with `just check`.
#
# Wiring a new gate touches three places, and the build fails if you stop at
# two — see docs/contributing/gates.md.
#
# The rules themselves live under conf.d/, split by concern so a reader hunting
# one gate knows which file to open: 10-rust.yaml (the Rust gates), 20-docs.yaml
# (the docs pipeline), 30-repo.yaml (repo-wide scripts and drift gates). This
# file keeps only what governs the whole run — policy and the import list —
# never a rule of its own.
#
# The entry below reads `conf.d/`, not `.mmz/conf.d/`: import paths resolve
# against THIS file's own directory, and this file already sits inside `.mmz`,
# so a `.mmz/` prefix would resolve to `.mmz/.mmz/conf.d/` and error. See
# https://mlavrinenko.github.io/mmz/composition/ for the worked example.
imports:
  - conf.d/                            # every *.yaml inside, lexical order

# Deliberately unset. Every probe below shells out to `just` and `jq`, and a
# probe resolves those through whatever PATH the caller had — so a bare
# `mt done` outside the dev shell measures a different `just` than `just check`
# recorded against. `probe_shell` is the key that closes that:
#
#   probe_shell: ["direnv", "exec", ".", "sh", "-c"]
#
# It is not set because neither candidate value is both cheap and available in
# CI. Each distinct probe is its own process and there are eleven, so the
# wrapper is paid eleven times per `mmz --is-fresh`: `direnv exec .` measures
# 0.12s (~1.3s total), `nix develop --command` 4.4s (~48s total). The second
# defeats the memoization this whole file exists to exploit. The first is
# cheap, but CI runs `nix develop --command just check` with no direnv in the
# dev shell, and `direnv exec` refuses an `.envrc` nobody allowed — so adopting
# it means a CI step that trusts a checked-out `.envrc`.
#
# See tasks/mmz-adopt-probe-shell-in-this-repo-s-own-manifest.typ (cancelled,
# with the numbers) before setting this. Until then the probes carry `jq -S`,
# which closes the accidental half of the exposure but not this one.

# Note printed to stderr on a cache hit, pulling the rule name from the record.
on_hit: "mmz: skipped {cache:command} (inputs unchanged)"
