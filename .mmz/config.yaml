# yaml-language-server: $schema=../schema/mmz.schema.json
#
# mmz memoizes its own checks (dogfood). Every `just check` arm runs through
# `just memo <gate>`, which is `mmz just <gate>` — so the rules below are named
# after RECIPES, not after command lines. That indirection is the point: naming
# the command line meant this file held a hand-maintained mirror of every recipe
# body, and a recipe growing a flag desynchronised the mirror silently.
#
# What the recipe DOES is then an input rather than an identity, which is what
# the per-recipe probes below are for. Hashing the whole Justfile instead (as
# this file used to) meant editing one docs recipe busted clippy and the full
# test suite.
#
# Every rule is tagged `gate`. Closing a MindTape task runs
# `mmz --is-fresh --tag gate` (see .mindtape/config.toml's `[[on.flip]]`), which
# asserts each gate rule last passed against this worktree instead of re-running
# it — the predicate a review wants is proof of a passing build, not a re-run at
# the least convenient moment. Record a pass with `just check`.
#
# Wiring a new gate touches three places, and the build fails if you stop at
# two — see docs/contributing/gates.md.

scopes:
  # Everything the Rust gates read: sources, the manifest and lockfile, and the
  # toolchain pins. flake.lock is in there because the dev shell is what
  # actually selects rustc — a toolchain bump that did not bust the clippy cache
  # would mean shipping against lints nobody ran.
  rust:
    [
      "src/**/*.rs",
      "tests/**/*.rs",
      "Cargo.toml",
      "Cargo.lock",
      "rust-toolchain.toml",
      "flake.lock",
    ]
  clippy-config: ["clippy.toml"]
  rustfmt-config: ["rustfmt.toml"]
  # cargo-machete reads the Cargo manifests, not the sources, so a source-only
  # edit must not bust it.
  manifests: ["Cargo.toml", "Cargo.lock"]
  # The docs pipeline: the site's sources and generators, the Markdown sources,
  # and the fixture every transcript is captured from.
  docs-src: ["www/**/*.typ", "www/**/*.sh", "www/**/*.jq", "www/tola.toml"]
  docs-assets: ["www/assets/**"]
  docs-md-src: ["docs/src/**/*.typ", "docs/generate-md.sh"]
  # The committed outputs of the Markdown render. They are inputs to the
  # freshness check, which compares them against a fresh render.
  docs-md-out: ["README.md", "AGENTS.md", "CONTRIBUTING.md", "docs/contributing/*.md"]
  fixture: ["examples/demo/**"]
  # The gate scripts, and the config files the size and drift gates read.
  gate-scripts: [".just/scripts/*.sh"]
  linecop-config: [".linecop.yaml"]
  outdatty-config: ["outdatty.yaml", "outdatty.lock"]

probes:
  # One probe per gate recipe: `just --dump` renders the recipe's body,
  # attributes and parameters as JSON, and hashing THAT scopes the dependency to
  # the one recipe instead of to the whole Justfile.
  #
  # `-e` is load-bearing on every one of these. Without it, a renamed recipe
  # would make the selector yield `null`, jq would exit 0, and the rule would go
  # permanently fresh against a digest that tracks nothing — the exact silent
  # failure this tool exists to prevent. With it, a rename is a loud probe
  # failure naming the probe (exit 6).
  recipe-fmt-check:
    run: just --dump --dump-format json | jq -e -c '.recipes["fmt-check"]'
  recipe-clippy:
    run: just --dump --dump-format json | jq -e -c '.recipes["clippy"]'
  recipe-test:
    run: just --dump --dump-format json | jq -e -c '.recipes["test"]'
  recipe-machete:
    run: just --dump --dump-format json | jq -e -c '.recipes["machete"]'
  recipe-check-file-size:
    run: just --dump --dump-format json | jq -e -c '.recipes["check-file-size"]'
  recipe-outdatty-check:
    run: just --dump --dump-format json | jq -e -c '.recipes["outdatty-check"]'
  recipe-check-doc-coverage:
    run: just --dump --dump-format json | jq -e -c '.recipes["check-doc-coverage"]'
  recipe-check-doc-facts:
    run: just --dump --dump-format json | jq -e -c '.recipes["check-doc-facts"]'
  # The docs module's recipes, reached through `.modules` — a module recipe is
  # not in the top-level `.recipes` map.
  recipe-docs-check:
    run: just --dump --dump-format json | jq -e -c '.modules.docs.recipes["check"], .modules.docs.recipes["gen"]'
  recipe-docs-md-check:
    run: just --dump --dump-format json | jq -e -c '.modules.docs.recipes["md-check"], .modules.docs.recipes["gen"]'
  # The formatter's own path lists live in Justfile variables rather than in a
  # recipe body, so fmt-check depends on them separately.
  fmt-paths:
    run: just --dump --dump-format json | jq -e -c '.assignments | with_entries(select(.key | test("_FMT_PATHS$")))'

# Note printed to stderr on a cache hit, pulling the rule name from the record.
on_hit: "mmz: skipped {cache:command} (inputs unchanged)"

commands:
  # `just fmt-check` formats Rust, Typst and the Justfiles, so every file any of
  # those three touch is an input — which is why the docs sources are in here
  # alongside the Rust.
  - name: just fmt-check
    inputs:
      [rust, rustfmt-config, docs-src, docs-md-src, fmt-paths, recipe-fmt-check]
    tags: [gate]

  - name: just clippy
    inputs: [rust, clippy-config, recipe-clippy]
    tags: [gate]

  - name: just test
    inputs: [rust, fixture, recipe-test]
    tags: [gate]

  - name: just machete
    inputs: [manifests, recipe-machete]
    tags: [gate]

  # linecop walks the whole tree, so this one is honestly broad. Its scopes are
  # the file sets whose SIZE the gate is judging, plus its own config.
  - name: just check-file-size
    inputs:
      [rust, docs-src, docs-md-src, docs-md-out, linecop-config, recipe-check-file-size]
    tags: [gate]

  - name: just outdatty-check
    inputs:
      [rust, docs-src, docs-md-src, docs-md-out, outdatty-config, recipe-outdatty-check]
    tags: [gate]

  # The doc gates read the binary's own help text and schema, so the Rust
  # sources are inputs to both.
  - name: just check-doc-coverage
    inputs: [rust, docs-src, gate-scripts, recipe-check-doc-coverage]
    tags: [gate]

  - name: just check-doc-facts
    inputs: [rust, docs-src, gate-scripts, fixture, recipe-check-doc-facts]
    tags: [gate]

  # The docs build compiles every page and runs the real binary against the
  # fixture, so it depends on the binary, the fixture, and the site sources.
  - name: just docs::check
    inputs: [rust, docs-src, docs-assets, fixture, recipe-docs-check]
    tags: [gate]

  - name: just docs::md-check
    inputs:
      [rust, docs-src, docs-md-src, docs-md-out, fixture, gate-scripts, recipe-docs-md-check]
    tags: [gate]
