# yaml-language-server: $schema=https://raw.githubusercontent.com/mlavrinenko/outdatty/main/schema/outdatty.schema.json

# Declares which dependents must be re-confirmed when a source changes. After
# editing a source, review the dependents and run `just outdatty-update` to
# record the new state; `just outdatty-check` (part of `just check`) fails until
# you do. Tune these groups to match where your project's coupled files live.
groups:
  # The CLI surface (commands, flags, behaviour) is documented by hand. Touching
  # the code flags the user-facing docs as needing a look.
  - name: cli-docs
    source:
      - src/main.rs
      - src/lib.rs
      - src/manifest.rs
      - src/init.rs
    dependents:
      - README.md
      - www/index.html

  # The manifest type and the JSON Schema that validates .mmz/config.yaml are
  # kept in sync by hand; a change to one must be mirrored in the other.
  - name: manifest-schema
    source:
      - src/manifest.rs
    dependents:
      - schema/mmz.schema.json

  # The --status=json output shape lives in src/status.rs; its JSON Schema is
  # maintained by hand alongside it.
  - name: status-schema
    source:
      - src/status.rs
    dependents:
      - schema/status.schema.json

  # A package change (version, dependencies, metadata) should land in the
  # changelog.
  - name: release-notes
    source:
      - Cargo.toml
    dependents:
      - CHANGELOG.md

  # The dev tooling and conventions documented for contributors track the
  # files that define them. .mmz/config.yaml's rules mirror the commands
  # `just check` memoizes, so a change to the recipe should be reflected there.
  - name: dev-docs
    source:
      - flake.nix
      - Justfile
    dependents:
      - CONTRIBUTING.md
      - AGENTS.md
      - .mmz/config.yaml
