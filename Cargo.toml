[workspace]
members = [] # Add sub-crate paths here as the project grows

[package]
name = "mmz"
version = "0.7.0"
edition = "2024"
rust-version = "1.85"
description = "memoized command runner"
license = "MIT"
repository = "https://github.com/mlavrinenko/mmz"
keywords = ["memoize", "cache", "incremental", "cli", "build"]
categories = ["command-line-utilities", "development-tools::build-utils"]
include = ["/src/", "/schema/", "/LICENSE*", "/README.md", "/CHANGELOG.md"]

[lib]
name = "mmz"
path = "src/lib.rs"

[[bin]]
name = "mmz"
path = "src/main.rs"

[dependencies]
thiserror = "2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1"
blake3 = "1"
globset = "0.4"
ignore = "0.4"
jaq-core = "3.1.0"
jaq-std = "3.0.2"
jaq-json = "2.0.2"
ast-grep-core = { version = "0.45.1", features = ["tree-sitter"] }
ast-grep-language = { version = "0.45.1", default-features = false }


# One tree-sitter grammar per feature, because a grammar is not small — the full
# set outweighs the binary carrying it many times over. No figure is quoted
# here on purpose: what each grammar costs is MEASURED, by `just measure-sizes`
# into www/sizes.yaml, and the docs read that file. A number typed here would be
# a copy with nothing to keep it true, which is how the last one went stale.
#
# `default` carries `lang-rust` alone. Not because mmz is written in Rust — it
# is a language-agnostic runner — but because a default set may only promise
# what the suite exercises, and one grammar is what mmz tests `ast:` against.
# Every other language is one flag away and mmz's error names the exact flag,
# so the cost of a wrong default is a message, never a silently missing input.
[features]
default = ["lang-rust"]

lang-bash = ["ast-grep-language/tree-sitter-bash"]
lang-c = ["ast-grep-language/tree-sitter-c"]
lang-cpp = ["ast-grep-language/tree-sitter-cpp"]
lang-csharp = ["ast-grep-language/tree-sitter-c-sharp"]
lang-css = ["ast-grep-language/tree-sitter-css"]
lang-dart = ["ast-grep-language/tree-sitter-dart"]
lang-elixir = ["ast-grep-language/tree-sitter-elixir"]
lang-go = ["ast-grep-language/tree-sitter-go"]
lang-haskell = ["ast-grep-language/tree-sitter-haskell"]
lang-hcl = ["ast-grep-language/tree-sitter-hcl"]
lang-html = ["ast-grep-language/tree-sitter-html"]
lang-java = ["ast-grep-language/tree-sitter-java"]
lang-javascript = ["ast-grep-language/tree-sitter-javascript"]
lang-json = ["ast-grep-language/tree-sitter-json"]
lang-kotlin = ["ast-grep-language/tree-sitter-kotlin"]
lang-lua = ["ast-grep-language/tree-sitter-lua"]
lang-markdown = ["ast-grep-language/tree-sitter-md"]
lang-nix = ["ast-grep-language/tree-sitter-nix"]
lang-php = ["ast-grep-language/tree-sitter-php"]
lang-python = ["ast-grep-language/tree-sitter-python"]
lang-ruby = ["ast-grep-language/tree-sitter-ruby"]
lang-rust = ["ast-grep-language/tree-sitter-rust"]
lang-scala = ["ast-grep-language/tree-sitter-scala"]
lang-solidity = ["ast-grep-language/tree-sitter-solidity"]
lang-swift = ["ast-grep-language/tree-sitter-swift"]
# One grammar crate, two parsers: `.tsx`'s `<div/>` is a type assertion in
# `.ts`, so ast-grep keeps them apart and so does mmz's language table.
lang-typescript = ["ast-grep-language/tree-sitter-typescript"]
lang-yaml = ["ast-grep-language/tree-sitter-yaml"]

# Every grammar, and the dominant cost of any build that carries it (priced in
# www/sizes.yaml); reach for the individual flags unless you need the lot.
lang-all = [
  "lang-bash",
  "lang-c",
  "lang-cpp",
  "lang-csharp",
  "lang-css",
  "lang-dart",
  "lang-elixir",
  "lang-go",
  "lang-haskell",
  "lang-hcl",
  "lang-html",
  "lang-java",
  "lang-javascript",
  "lang-json",
  "lang-kotlin",
  "lang-lua",
  "lang-markdown",
  "lang-nix",
  "lang-php",
  "lang-python",
  "lang-ruby",
  "lang-rust",
  "lang-scala",
  "lang-solidity",
  "lang-swift",
  "lang-typescript",
  "lang-yaml",
]
[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
# --- Correctness & Safety ---
out_of_bounds_indexing = "deny"
iter_out_of_bounds = "deny"
mem_forget = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
unreachable = "deny"
todo = "deny"

# --- Code Quality ---
cognitive_complexity = "deny"
too_many_lines = "deny"
similar_names = "deny"
many_single_char_names = "deny"
if_same_then_else = "deny"
unnecessary_wraps = "deny"
large_enum_variant = "deny"
struct_excessive_bools = "deny"
new_without_default = "deny"
should_implement_trait = "deny"
type_complexity = "deny"
too_many_arguments = "deny"
needless_lifetimes = "deny"
needless_pass_by_value = "deny"
cloned_instead_of_copied = "deny"
flat_map_option = "deny"
implicit_clone = "deny"
inefficient_to_string = "deny"
map_unwrap_or = "deny"
manual_let_else = "deny"

# --- Redundancy ---
no_effect = "deny"
redundant_closure_call = "deny"
redundant_closure = "deny"
redundant_pattern = "deny"
redundant_static_lifetimes = "deny"
redundant_field_names = "deny"
neg_multiply = "deny"
approx_constant = "deny"
useless_let_if_seq = "deny"
useless_vec = "deny"
unused_unit = "deny"
unused_self = "deny"
deprecated_cfg_attr = "deny"
unseparated_literal_suffix = "deny"
search_is_some = "deny"

# --- Pattern Matching ---
single_match = "deny"
single_match_else = "deny"
match_wild_err_arm = "deny"
match_overlapping_arm = "deny"

# --- Imports & Naming ---
wildcard_imports = "deny"
module_inception = "deny"
upper_case_acronyms = "deny"
enum_glob_use = "deny"

# --- Documentation ---
missing_errors_doc = "deny"
missing_panics_doc = "deny"
doc_markdown = "deny"

# --- Casts ---
trivially_copy_pass_by_ref = "deny"
ptr_as_ptr = "deny"
ptr_cast_constness = "deny"
ref_as_ptr = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"

# --- Debug Leftovers ---
dbg_macro = "deny"

# --- String Conversions ---
str_to_string = "deny"

# --- Shared Ownership ---
rc_buffer = "deny"

# --- Patterns & Exhaustiveness ---
rest_pat_in_fully_bound_structs = "deny"

# --- File I/O ---
verbose_file_reads = "deny"

# --- Numeric ---
lossy_float_literal = "deny"

# --- Formatting ---
empty_line_after_outer_attr = "deny"
empty_line_after_doc_comments = "deny"
fn_params_excessive_bools = "deny"
needless_raw_string_hashes = "deny"

# --- Style ---
semicolon_if_nothing_returned = "deny"
redundant_else = "deny"
redundant_closure_for_method_calls = "deny"
match_same_arms = "deny"
undocumented_unsafe_blocks = "deny"
bool_to_int_with_if = "deny"
manual_string_new = "deny"
uninlined_format_args = "deny"
